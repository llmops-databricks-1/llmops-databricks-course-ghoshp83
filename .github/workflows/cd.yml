name: CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
      inputs:
        project:
          description: 'Which project to run?'
          required: true
          default: 'arxiv_curator'
          type: choice
          options:
            - arxiv_curator
            - nhtsa_defect_intel

jobs:
  # Detect which project folder(s) changed in the push to main so we
  # only deploy the affected project. On workflow_dispatch the filter
  # outputs are ignored and the chosen project is deployed explicitly.
  changes:
    runs-on: ubuntu-latest
    outputs:
      arxiv_curator: ${{ steps.filter.outputs.arxiv_curator }}
      nhtsa_defect_intel: ${{ steps.filter.outputs.nhtsa_defect_intel }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 #v3.0.3
        id: filter
        with:
          filters: |
            arxiv_curator:
              - 'arxiv_curator/**'
              - '.github/workflows/cd.yml'
            nhtsa_defect_intel:
              - 'nhtsa_defect_intel/**'
              - '.github/workflows/cd.yml'

  arxiv_curator:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.project == 'arxiv_curator') || (github.event_name == 'push' && needs.changes.outputs.arxiv_curator == 'true') }}
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DEPLOY_TARGET: ${{ matrix.environment }}
    strategy:
      matrix:
        environment: [acc]
    environment: ${{ matrix.environment }}
    permissions:
      contents: write # to push tag
    # Set the context to the specific project folder
    defaults:
      run:
        working-directory: arxiv_curator
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks CLI
        run: |
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host = ${{ vars.DATABRICKS_HOST }}
          client_id = ${{ secrets.DATABRICKS_CLIENT_ID }}
          client_secret = ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          EOF

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 #v5.4.1

      - name: Deploy to Databricks
        run: |
            databricks bundle deploy \
              --target $DEPLOY_TARGET \
              --var="git_sha=${{ github.sha }}" \
              --var="branch=${{ github.ref_name }}"

  nhtsa_defect_intel:
    needs: changes
    if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.project == 'nhtsa_defect_intel') || (github.event_name == 'push' && needs.changes.outputs.nhtsa_defect_intel == 'true') }}
    runs-on: ubuntu-latest
    env:
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DEPLOY_TARGET: ${{ matrix.environment }}
    strategy:
      matrix:
        environment: [acc]
    environment: ${{ matrix.environment }}
    permissions:
      contents: write # to push tag
    # Set the context to the specific project folder
    defaults:
      run:
        working-directory: nhtsa_defect_intel
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks CLI
        run: |
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host = ${{ vars.DATABRICKS_HOST }}
          client_id = ${{ secrets.DATABRICKS_CLIENT_ID }}
          client_secret = ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          EOF

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 #v5.4.1

      - name: Deploy to Databricks
        run: |
            databricks bundle deploy \
              --target $DEPLOY_TARGET \
              --var="git_sha=${{ github.sha }}" \
              --var="branch=${{ github.ref_name }}"
