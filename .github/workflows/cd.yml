name: CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
      inputs:
        project:
          description: 'Which project to run?'
          required: true
          default: 'arxiv_curator'
          type: choice
          options:
            - arxiv_curator
            - nhtsa_defect_intel

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      ACTIVE_PROJECT: arxiv_curator
      DATABRICKS_HOST: ${{ vars.DATABRICKS_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DEPLOY_TARGET: ${{ matrix.environment }}
    strategy:
      matrix:
        environment: [acc]
    environment: ${{ matrix.environment }}
    permissions:
      contents: write # to push tag
    # Set the context to the specific project folder
    defaults:
      run:
        working-directory: ${{ github.event.inputs.project || env.ACTIVE_PROJECT }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 #v4.2.2

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Configure Databricks CLI
        run: |
          mkdir -p ~/.databricks
          cat > ~/.databrickscfg << EOF
          [DEFAULT]
          host = ${{ vars.DATABRICKS_HOST }}
          client_id = ${{ secrets.DATABRICKS_CLIENT_ID }}
          client_secret = ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          EOF

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 #v5.4.1

      - name: Deploy to Databricks
        run: |
            databricks bundle deploy \
              --target $DEPLOY_TARGET \
              --var="git_sha=${{ github.sha }}" \
              --var="branch=${{ github.ref_name }}"
