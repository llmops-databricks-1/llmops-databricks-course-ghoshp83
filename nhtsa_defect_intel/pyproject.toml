[project]
name = "nhtsa-curator"
dynamic = ["version"]
description = "NHTSA Defect Intelligence Agent — end-to-end LLMOps on Databricks over open NHTSA recalls, complaints, investigations, and Technical Service Bulletins."
requires-python = ">=3.12, <3.13"
dependencies = [
    "cffi==1.17.1",
    "cloudpickle==3.1.1",
    "numpy==2.4.0",
    "pandas==2.3.0",
    "pyarrow==22.0.0",
    "databricks-sdk==0.85.0",
    "pydantic==2.11.7",
    "loguru==0.7.3",
    "python-dotenv==1.1.1",
    "databricks-vectorsearch==0.63",
    "openai==2.8.0",
    "databricks-mcp==0.4.0",
    "backoff==2.2.1",
    "mlflow==3.8.1",
    "nest-asyncio==1.6.0",
    "databricks-agents==1.8.2",
    "psycopg==3.3.2",
    "psycopg-pool==3.3.0",
    "psycopg[binary]==3.3.2",
    "httpx==0.28.1",
    "tenacity==9.0.0"
]

[project.optional-dependencies]
dev = ["databricks-connect>=17.0, <18",
       "ipykernel>=6.29.5, <7",
       "pip>=25.0.1, <26",
       "pre-commit>=4.1.0, <5"]

ci = ["pre-commit>=4.1.0, <5",
      "pytest>=8.3.4, <9"]

[build-system]
requires = ["setuptools>=72.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["nhtsa_curator*"]

[tool.setuptools.dynamic]
version = { file = "version.txt" }

[tool.pytest.ini_options]
addopts = "-s --no-header --no-summary"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 90

[tool.ruff.lint]
select = ["F", "E", "W", "B", "I", "UP", "SIM", "ERA", "C", "ANN"]
ignore = ["D107", "D203", "D213", "C901", "ERA001", "ANN204", "ANN401"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*.py" = ["E501", "E402", "ANN201", "ANN202", "F821"]
"tests/*.py" = ["ANN201", "ANN202"]

[tool.ruff.format]
indent-style = "space"
