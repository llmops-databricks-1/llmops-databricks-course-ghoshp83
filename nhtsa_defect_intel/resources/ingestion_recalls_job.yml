resources:
  jobs:
    ingestion_recalls_job:
      name: nhtsa_recalls_ingestion
      tags:
        project_name: "nhtsa-curator"
        dataset: "recalls"

      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "UTC"
        pause_status: ${var.schedule_pause_status}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: recalls_ingestion
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/1.1_recalls_ingestion.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"
