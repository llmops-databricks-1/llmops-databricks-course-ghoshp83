resources:
  jobs:
    ingestion_investigations_job:
      name: nhtsa_investigations_ingestion
      tags:
        project_name: "nhtsa-curator"
        dataset: "investigations"

      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: "UTC"
        pause_status: ${var.schedule_pause_status}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: investigations_ingestion
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/1.3_investigations_ingestion.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"
