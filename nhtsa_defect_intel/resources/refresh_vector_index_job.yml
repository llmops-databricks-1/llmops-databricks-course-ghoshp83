resources:
  jobs:
    refresh_vector_index_job:
      name: nhtsa_refresh_vector_index
      tags:
        project_name: "nhtsa-curator"
        layer: "vector_search"

      # Runs after gold_job (14 UTC) — give it 2h to drain. The
      # delta-sync index also catches CDF without this trigger; this
      # cron is the safety net + the place to wire alerting.
      schedule:
        quartz_cron_expression: "0 0 16 * * ?"
        timezone_id: "UTC"
        pause_status: ${var.schedule_pause_status}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: ensure_index
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/3.1_vector_index_setup.py
            base_parameters:
              env: ${bundle.target}
              run_id: "{{job.run_id}}"
              wait_for_online: "false"  # cron path skips the long block

        - task_key: smoke_retrieval
          environment_key: default
          depends_on:
            - task_key: ensure_index
          notebook_task:
            notebook_path: ../notebooks/3.3_smoke_retrieval.py
            base_parameters:
              env: ${bundle.target}
              run_id: "{{job.run_id}}"
