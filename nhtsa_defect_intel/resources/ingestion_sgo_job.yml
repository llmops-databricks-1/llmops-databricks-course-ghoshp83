resources:
  jobs:
    ingestion_sgo_job:
      name: nhtsa_sgo_ingestion
      tags:
        project_name: "nhtsa-curator"
        dataset: "sgo"

      # Monthly on the 5th at 10:00 UTC; cron differs from the daily jobs.
      schedule:
        quartz_cron_expression: "0 0 10 5 * ?"
        timezone_id: "UTC"
        pause_status: ${var.schedule_pause_status}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: sgo_ingestion
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/1.5_sgo_ingestion.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"
