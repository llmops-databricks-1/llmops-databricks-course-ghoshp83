resources:
  jobs:
    update_and_evaluate_traces:
      name: nhtsa-update-and-evaluate-traces
      schedule:
        quartz_cron_expression: "0 0 * * * ?"   # every hour on the hour
        timezone_id: "Europe/London"
        pause_status: ${var.schedule_pause_status}
      tags:
        project_name: "nhtsa-defect-intel"
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: update_and_evaluate
          environment_key: default
          notebook_task:
            notebook_path: deployment_scripts/update_traces_aggregated.py
            base_parameters:
              env: ${bundle.target}
