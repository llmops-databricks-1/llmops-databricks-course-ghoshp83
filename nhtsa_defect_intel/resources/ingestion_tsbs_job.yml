resources:
  jobs:
    ingestion_tsbs_job:
      name: nhtsa_tsbs_ingestion
      tags:
        project_name: "nhtsa-curator"
        dataset: "tsbs"

      schedule:
        quartz_cron_expression: "0 0 9 * * ?"
        timezone_id: "UTC"
        pause_status: ${var.schedule_pause_status}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: tsbs_ingestion
          environment_key: default
          notebook_task:
            notebook_path: ../notebooks/1.4_tsbs_ingestion.py
            base_parameters:
              env: ${bundle.target}
              git_sha: "${var.git_sha}"
              run_id: "{{job.run_id}}"
              max_pdfs_per_run: "500"
