# Production environment
prd:
  catalog: llmops_dev
  schema: nhtsa
  volume: nhtsa_files
  llm_endpoint: databricks-meta-llama-3-1-70b-instruct
  embedding_endpoint: databricks-gte-large-en
  warehouse_id: 7077f4cb0e616c62
  vector_search_endpoint: llmops_course_vs_endpoint
  genie_space_id: "PLACEHOLDER_PRD_GENIE_SPACE_ID"

# Model configuration
model_config:
  temperature: 0.2          # lower than arxiv (0.7) — defect answers must be factual
  max_tokens: 2000
  top_p: 0.95

# Vector search configuration
vector_search:
  embedding_dimension: 1024
  similarity_metric: cosine
  num_results: 8            # higher than arxiv (5) — defect questions often need more evidence

# Chunking configuration
chunking:
  chunk_size: 800           # TSBs are denser than abstracts; larger chunks preserve procedural context
  chunk_overlap: 100
  separator: "\n\n"

# NHTSA data sources — endpoints + refresh cadences
nhtsa_sources:
  recalls_api: "https://api.nhtsa.gov/recalls/recallsByVehicle"
  complaints_api: "https://api.nhtsa.gov/complaints/complaintsByVehicle"
  recalls_bulk_csv: "https://static.nhtsa.gov/odi/ffdd/rcl/FLAT_RCL_POST_2010.zip"
  complaints_bulk_csv: "https://static.nhtsa.gov/odi/ffdd/cmpl/FLAT_CMPL.zip"
  investigations_bulk_csv: "https://static.nhtsa.gov/odi/ffdd/inv/FLAT_INV.zip"
  # NHTSA split the TSB dump into 5-year chunks (May 2024 MfrComms rewrite).
  # List covers the full range; append new windows as NHTSA publishes them.
  tsbs_bulk_csv:
    - "https://static.nhtsa.gov/odi/ffdd/tsbs/TSBS_RECEIVED_1995-1999.zip"
    - "https://static.nhtsa.gov/odi/ffdd/tsbs/TSBS_RECEIVED_2000-2004.zip"
    - "https://static.nhtsa.gov/odi/ffdd/tsbs/TSBS_RECEIVED_2005-2009.zip"
    - "https://static.nhtsa.gov/odi/ffdd/tsbs/TSBS_RECEIVED_2010-2014.zip"
    - "https://static.nhtsa.gov/odi/ffdd/tsbs/TSBS_RECEIVED_2015-2019.zip"
    - "https://static.nhtsa.gov/odi/ffdd/tsbs/TSBS_RECEIVED_2020-2024.zip"
    - "https://static.nhtsa.gov/odi/ffdd/tsbs/TSBS_RECEIVED_2025-2026.zip"
  # NHTSA SGO publishes two cumulative CSVs: ADS (SAE L3-5 robotaxis) and
  # ADAS (SAE L2 consumer). The file-downloads "?p=" URL is a directory
  # listing page and returns 403 to scripts, so point at the direct CSVs
  # on static.nhtsa.gov.
  sgo_av_csv:
    - "https://static.nhtsa.gov/odi/ffdd/sgo-2021-01/SGO-2021-01_Incident_Reports_ADS.csv"
    - "https://static.nhtsa.gov/odi/ffdd/sgo-2021-01/SGO-2021-01_Incident_Reports_ADAS.csv"
  ingestion_cadence_days: 1
