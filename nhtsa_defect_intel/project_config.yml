  genie_space_id: "PLACEHOLDER_ACC_GENIE_SPACE_ID"
  usage_policy_id: 4f4f43f7-3b6f-4f0a-9dd3-f8a271a90fb3
  lakebase_project_id: nhtsa-agent-lakebase-pg
